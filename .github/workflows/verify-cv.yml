name: Verify FolioPress builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install pinned compiler (checksum verified)
        run: python3 bootstrap.py
      - name: Build and check content, fonts, bounds and reading order
        run: bash build.sh --all
      - name: Check rendered formatting regressions
        run: python3 -m unittest discover -s tests -v
      - name: Ensure committed outputs match their source
        run: git diff --exit-code -- '*.pdf'
